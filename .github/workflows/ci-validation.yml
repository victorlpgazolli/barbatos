name: Compile and Test

on:
  pull_request:
    branches: [ "master" ]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'bridge/**'
      - 'Makefile'
      - '.github/actions/**'
      - '.github/workflows/ci-validation.yml'
  workflow_dispatch:
    inputs:
      bridge:
        options:
          - 'true'
          - 'false'
        description: 'Run Bridge validation'
        default: 'false'

jobs:
  detect-changes:
    name: Detect Changed Parts
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    outputs:
      bridge: ${{ steps.filter.outputs.bridge }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: filter
        if: github.event_name == 'pull_request'
        run: |
          FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          BRIDGE=$(echo "$FILES" | grep -E '^bridge/' || true)
          INFRA=$(echo "$FILES" | grep -E '^(Makefile|.github/actions/)' || true)
          if [ ! -z "$BRIDGE" ] || [ ! -z "$INFRA" ]; then echo "bridge=true" >> $GITHUB_OUTPUT; fi

  bridge-validation:
    name: Bridge Validation
    needs: detect-changes
    if: needs.detect-changes.outputs.bridge == 'true' || (github.event_name == 'workflow_dispatch' && github.event.inputs.bridge == 'true')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Bridge Dependencies
        run: |
          cd bridge
          pip install -r requirements.txt
          pip install pytest
          
      - name: Run Bridge Unit Tests
        run: |
          cd bridge
          python3 -m pytest test_bridge.py
          
      - name: Validate Bridge Syntax
        run: |
          make install_dependencies && make compile_bridge
          cd bridge
          python3 -m py_compile bridge.py
