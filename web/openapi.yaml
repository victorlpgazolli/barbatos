openapi: 3.0.3
info:
  title: Barbatos REST API
  version: 2.0.0-alpha03
  description: |
    HTTP transport of the barbatos bridge. The binary drives a Frida agent injected into
    an Android process and exposes it over plain HTTP endpoints.

    Started with `barbatos rpc` (no arguments otherwise) — binds `127.0.0.1:8080` and kills
    whatever already holds the port. There is no authentication: the server is loopback-only.

    This spec is served by the bridge itself: **<http://127.0.0.1:8080/docs>** renders it,
    `GET /openapi.yaml` returns it raw. Both are embedded in the binary at build time, so
    they work on any install without the repo checked out.

    ### Transports

    | Transport | How to start | Surface |
    |---|---|---|
    | HTTP (this document) | `barbatos rpc` | `GET /ping`, `POST /v0/api/*`, `GET /docs`, `GET /openapi.yaml` |
    | MCP over Streamable HTTP | `barbatos mcp` | `initialize`, `tools/list`, `tools/call`, `prompts/list`, `resources/list` |
    | Help | `barbatos` | Prints usage and an overview of both transports |

    Both transports dispatch into the same `RpcHandler`, so every endpoint below is also
    reachable as an MCP tool (camelCase tool name). `listClassesStream` streams its chunks
    over HTTP (`application/x-ndjson`) and, over MCP, returns the accumulated chunk lines
    as the `tools/call` result. `tools/list` returns each method as
    `{name, description, inputSchema}`, where `inputSchema` is the JSON Schema generated
    from the corresponding `*Params` class.

    ### Endpoint contract

    Every endpoint is `POST /v0/api/<snake_case method>` and takes the params object as
    the raw JSON body (no envelope). The response is the plain result object. Parameterless
    endpoints accept an empty body.

    | Endpoint | Parameters schema | Required params | Result schema |
    |---|---|---|---|
    | **/v0/api/count_instances** | `CountInstancesParams` | `className` | `CountInstancesResult` |
    | **/v0/api/inspect_class** | `InspectClassParams` | `className` | `InspectClassResult` |
    | **/v0/api/list_instances** | `ListInstancesParams` | `className` | `ListInstancesResult` |
    | **/v0/api/get_instance_addresses** | `GetInstanceAddressesParams` | `className` | `GetInstanceAddressesResult` |
    | **/v0/api/inspect_instance** | `InspectInstanceParams` | `className`, `id` | `InspectInstanceResult` |
    | **/v0/api/set_field_value** | `SetFieldValueParams` | all | `StatusResult` |
    | **/v0/api/hook_method** | `HookParams` | `className`, `methodSig` | `StatusResult` |
    | **/v0/api/set_method_implementation** | `SetMethodImplementationParams` | all | `StatusResult` |
    | **/v0/api/run_once** | `RunOnceParams` | all | `StatusResult` |
    | **/v0/api/get_hook_events** | (none) | — | `HookEventsResult` |
    | **/v0/api/inject_gadget_from_scratch** | `InjectGadgetParams` | (none) | `InjectGadgetResult` |
    | **/v0/api/health_check** | (none) | — | `HealthCheckResult` |
    | **/v0/api/list_classes_stream** | `ListClassesParams` | (none) | NDJSON stream — see below |

    Params keys are the wire names (`@SerialName`), which differ from the Kotlin property
    names where noted.

    ### Session lifecycle

    Call **POST /v0/api/inject_gadget_from_scratch** first — it detects the foreground app,
    picks the rooted (frida-server over USB) or debuggable (Gadget over JDWP) path, and
    attaches. Every endpoint other than `health_check` needs that active session; without
    one the bridge answers `"error: Frida script not loaded."`.

    ### Error handling

    Non-success responses carry a body of the shape `{"error":{"code":<int>,"message":...}}`
    with a real HTTP status: `400` malformed body (`-32700`), `404` unknown endpoint
    (`-32601`), `500` anything thrown by the bridge (`-32603`).

servers:
  - url: http://127.0.0.1:8080
    description: Local bridge server (loopback only, no auth)
paths:
  /ping:
    get:
      summary: Liveness probe
      description: |
        Verifies the HTTP server is up. Does not touch the Frida session — it answers
        even when no injection has happened yet. Use `health_check` to probe ADB, root
        status and session state.
      responses:
        '200':
          description: Bridge is operational
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: pong
  /docs:
    get:
      summary: Swagger UI
      responses:
        '200':
          description: HTML docs page rendering this spec
  /openapi.yaml:
    get:
      summary: Raw OpenAPI spec
      responses:
        '200':
          description: This spec as embedded in the binary
  /v0/api/health_check:
    post:
      summary: healthCheck — probe ADB, root, frontmost app and session
      description: |
        Callable without an active session. Returns `overall` ("ok" or "degraded") plus a
        `checks` map covering adb, android_root, android_frontmost_app, frida_device,
        frida_connection and session.
      responses:
        '200':
          description: Health check result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResult'
              examples:
                ok:
                  value:
                    overall: ok
                    checks:
                      adb:
                        status: ok
                        message: adb available
                      android_root:
                        status: skipped
                        message: Not checked
                    recommendation: null
        '500':
          $ref: '#/components/responses/InternalError'
  /v0/api/inject_gadget_from_scratch:
    post:
      summary: injectGadgetFromScratch — start a session (call this first)
      description: |
        Detects the foreground app, picks the rooted or debuggable injection path and
        attaches. Every field of the body is optional.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InjectGadgetParams'
            examples:
              default:
                value:
                  with_logs: true
                  limit: 100
                  serial: null
      responses:
        '200':
          description: Injection outcome with per-step status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InjectGadgetResult'
        '500':
          $ref: '#/components/responses/InternalError'
  /v0/api/count_instances:
    post:
      summary: countInstances — how many live instances on the heap?
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CountInstancesParams'
            examples:
              default:
                value:
                  className: com.example.MyClass
      responses:
        '200':
          description: Instance count
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountInstancesResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /v0/api/inspect_class:
    post:
      summary: inspectClass — list a class's fields and methods
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InspectClassParams'
      responses:
        '200':
          description: Class structure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InspectClassResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /v0/api/list_instances:
    post:
      summary: listInstances — get instance ids for a class
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListInstancesParams'
      responses:
        '200':
          description: Live instances
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListInstancesResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /v0/api/get_instance_addresses:
    post:
      summary: getInstanceAddresses — memory addresses of live instances
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetInstanceAddressesParams'
      responses:
        '200':
          description: Addresses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetInstanceAddressesResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /v0/api/inspect_instance:
    post:
      summary: inspectInstance — read a live object's field values
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InspectInstanceParams'
      responses:
        '200':
          description: Field values with pagination
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InspectInstanceResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /v0/api/set_field_value:
    post:
      summary: setFieldValue — mutate a field at runtime
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetFieldValueParams'
      responses:
        '200':
          description: Status result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /v0/api/hook_method:
    post:
      summary: hookMethod — record every call to a method
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HookParams'
      responses:
        '200':
          description: Status result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /v0/api/set_method_implementation:
    post:
      summary: setMethodImplementation — replace a method for the session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetMethodImplementationParams'
      responses:
        '200':
          description: Status result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /v0/api/run_once:
    post:
      summary: runOnce — replace a method for a single call, then restore
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunOnceParams'
      responses:
        '200':
          description: Status result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /v0/api/get_hook_events:
    post:
      summary: getHookEvents — drain the calls recorded so far
      description: Takes no parameters. The body may be empty.
      responses:
        '200':
          description: Hook events accumulated since the last call
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HookEventsResult'
        '500':
          $ref: '#/components/responses/InternalError'
  /v0/api/list_classes_stream:
    post:
      summary: listClassesStream — search loaded classes (NDJSON response)
      description: |
        Streams matching class names as NDJSON (`application/x-ndjson`): one plain
        `ListClassesPartialResult` object (`{"list": [...]}`) per line. The stream ends
        when the connection closes; there is no terminating sentinel. A failure mid-stream
        emits a single `ApiError` line.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListClassesParams'
            examples:
              default:
                value:
                  search_param: MyClass
                  app_package: com.example.myapp
                  offset: 0
                  limit: 200
      responses:
        '200':
          description: NDJSON stream of chunks, one per line
          content:
            application/x-ndjson:
              schema:
                $ref: '#/components/schemas/ListClassesPartialResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  responses:
    BadRequest:
      description: Malformed JSON body
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Unknown endpoint
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    InternalError:
      description: The bridge threw while processing the request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          enum: [-32700, -32601, -32603]
          description: |
            `-32700` malformed body, `-32601` unknown endpoint, `-32603` internal error.
        message:
          type: string

    # -------------------------
    # Parameter schemas
    # -------------------------
    ListClassesParams:
      type: object
      description: Used only by `list_classes_stream`. Every field has a default.
      properties:
        search_param:
          type: string
          default: ""
          description: Substring filter on the class name. Empty matches everything.
        app_package:
          type: string
          default: ""
        offset:
          type: integer
          default: 0
        limit:
          type: integer
          default: 200

    InspectClassParams:
      type: object
      required: [className]
      properties:
        className:
          type: string
          description: Fully qualified class name.
          example: com.example.MyClass

    CountInstancesParams:
      type: object
      required: [className]
      properties:
        className:
          type: string

    ListInstancesParams:
      type: object
      required: [className]
      properties:
        className:
          type: string

    GetInstanceAddressesParams:
      type: object
      required: [className]
      properties:
        className:
          type: string

    InspectInstanceParams:
      type: object
      required: [className, id]
      properties:
        className:
          type: string
        id:
          type: string
          description: Instance id returned by `list_instances`.
        offset:
          type: integer
          default: 0
        limit:
          type: integer
          default: 50

    SetFieldValueParams:
      type: object
      required: [className, id, fieldName, type, newValue]
      properties:
        className:
          type: string
        id:
          type: string
          description: Instance id returned by `list_instances`.
        fieldName:
          type: string
        type:
          type: string
          description: Java type name.
          example: String
        newValue:
          type: string
          description: String representation of the new value, coerced using `type`.

    HookParams:
      type: object
      required: [className, methodSig]
      properties:
        className:
          type: string
        methodSig:
          type: string
          description: Method name.
          example: myMethod

    SetMethodImplementationParams:
      type: object
      required: [className, methodSig, code]
      properties:
        className:
          type: string
        methodSig:
          type: string
        code:
          type: string
          description: |
            JavaScript body evaluated in place of the original implementation. `args`
            holds the arguments, `this` the receiver. Persists for the session.

    RunOnceParams:
      type: object
      required: [className, methodSig, code]
      properties:
        className:
          type: string
        methodSig:
          type: string
        code:
          type: string
          description: |
            Same contract as `SetMethodImplementationParams.code`, but the original
            implementation is restored after the first call.

    InjectGadgetParams:
      type: object
      description: Every field is optional.
      properties:
        with_logs:
          type: boolean
          default: true
        limit:
          type: integer
          default: 100
        serial:
          type: string
          nullable: true
          description: Device serial from `adb devices`.

    # -------------------------
    # Result schemas
    # -------------------------
    StatusResult:
      type: object
      description: |
        Shared shape of `set_field_value`, `hook_method`, `set_method_implementation` and
        `run_once`.
      required: [status]
      properties:
        status:
          type: string
          example: "true"

    CountInstancesResult:
      type: object
      required: [count]
      properties:
        count:
          type: integer

    InspectClassResult:
      type: object
      description: |
        Includes private, synthetic and compiler-generated members (R8 lambdas, Kotlin
        accessors). Entries are full Java signature strings.
      required: [staticAttributes, instanceAttributes, methods]
      properties:
        staticAttributes:
          type: array
          items:
            type: string
        instanceAttributes:
          type: array
          items:
            type: string
        methods:
          type: array
          items:
            type: string

    ListInstancesResult:
      type: object
      required: [instances, totalCount, detectionMethod]
      properties:
        instances:
          type: array
          items:
            $ref: '#/components/schemas/InstanceInfo'
        totalCount:
          type: integer
        detectionMethod:
          type: string
          default: heap_scan

    InstanceInfo:
      type: object
      required: [id, handle, summary, detectionMethod]
      properties:
        id:
          type: string
          description: Pass this to `inspect_instance` and `set_field_value`.
        handle:
          type: string
        summary:
          type: string
          description: toString-like rendering.
        detectionMethod:
          type: string
          default: heap_scan

    GetInstanceAddressesResult:
      type: object
      required: [addresses]
      properties:
        addresses:
          type: array
          items:
            type: string
            example: MyClass@2ec2d5e

    InspectInstanceResult:
      type: object
      required: [attributes]
      properties:
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/InstanceAttribute'

    InstanceAttribute:
      type: object
      required: [name, type, value, isPagination, nextOffset]
      properties:
        name:
          type: string
        type:
          type: string
        value:
          type: string
          description: String representation of the runtime value.
        childId:
          type: string
          nullable: true
          description: Pass to `inspect_instance` to drill into a nested object.
        childClassName:
          type: string
          nullable: true
        isPagination:
          type: boolean
          default: false
        nextOffset:
          type: integer
          default: 0

    HookEventsResult:
      type: object
      description: |
        Drains the events recorded by `hook_method` since the previous call. Empty until
        a hooked method is invoked.
      required: [events]
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/HookEvent'

    HookEvent:
      type: object
      required: [timestamp]
      properties:
        timestamp:
          type: integer
          format: int64
          default: 0
        target:
          $ref: '#/components/schemas/HookEventTarget'
        data:
          description: Arbitrary JSON payload — arguments and return value.
          nullable: true

    HookEventTarget:
      type: object
      nullable: true
      required: [className, memberSignature, type]
      properties:
        className:
          type: string
          default: ""
        memberSignature:
          type: string
          default: ""
        type:
          type: string
          default: ""

    InjectGadgetResult:
      type: object
      required: [status, steps]
      properties:
        status:
          type: string
          enum: [completed, error]
        steps:
          type: array
          items:
            $ref: '#/components/schemas/InjectionStep'
        logs:
          type: array
          nullable: true
          items:
            type: string
        error_message:
          type: string
          nullable: true

    InjectionStep:
      type: object
      required: [id, title, status]
      properties:
        id:
          type: string
        title:
          type: string
        status:
          type: string

    HealthCheckResult:
      type: object
      description: |
        Callable without an active session. Components reported under `checks`: `adb`,
        `android_root`, `android_frontmost_app`, `frida_device`, `frida_connection`,
        `session`.
      required: [overall, checks]
      properties:
        overall:
          type: string
          enum: [ok, degraded]
        checks:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/CheckResponse'
        recommendation:
          type: string
          nullable: true

    CheckResponse:
      type: object
      required: [status, message]
      properties:
        status:
          type: string
          enum: [ok, info, warning, error, skipped, unknown]
        message:
          type: string
        fix:
          type: string
          nullable: true
          description: Suggested remediation command, when one applies.
        package:
          type: string
          nullable: true
          description: Set by `android_frontmost_app`.
        pid:
          type: integer
          nullable: true
          description: Set by `android_frontmost_app`.
        debuggable:
          type: boolean
          nullable: true
          description: Set by `android_frontmost_app`.

    ListClassesPartialResult:
      type: object
      description: |
        One NDJSON chunk of `list_classes_stream`.
      required: [list]
      properties:
        list:
          type: array
          items:
            type: string